name: Run Manga Translation Bot

on:
  push:
    branches:
      - main
  workflow_dispatch: # يتيح لك تشغيل البوت يدوياً من واجهة GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          MANGA_BOT_TELEGRAM_BOT_TOKEN: ${{ secrets.MANGA_BOT_TELEGRAM_BOT_TOKEN }}
          MANGA_BOT_AI_API_KEY: ${{ secrets.MANGA_BOT_AI_API_KEY }}
        run: python main.py